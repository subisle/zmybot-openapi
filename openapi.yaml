openapi: 3.0.3
info:
  title: ZmyBot
  version: 0.2.0
  description: |
    本机地址 `http://127.0.0.1:58080`。
    请求头带 `Authorization: Bearer <token>`。
    接收人可以是好友 wxid，也可以是群 id，群 id 以 `@chatroom` 结尾。
    发图片需要启动参数 `--hook_profile=full`。
servers:
  - url: http://127.0.0.1:58080
    description: 本机
tags:
  - name: 消息
  - name: WebSocket
paths:
  /send_image:
    post:
      summary: 发送图片消息
      tags: [消息]
      x-apifox-folder: 消息
      description: 接收人填好友 wxid 或群 id。`path` 写一张路径，或多张路径的数组。按顺序逐张发送。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [robot_wxid, to_wxid, path]
              properties:
                robot_wxid:
                  type: string
                  description: 机器人 wxid
                to_wxid:
                  type: string
                  description: 好友 wxid，或群 id
                path:
                  description: 图片路径。字符串是一张，数组是多张
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            example:
              robot_wxid: wxid_self
              to_wxid: 34757816141@chatroom
              path:
                - /tmp/a.png
                - /tmp/b.jpg
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  to_wxid:
                    type: string
                  target_type:
                    type: string
                    description: private 好友，group 群
                  sent:
                    type: integer
                    description: 成功张数
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        status:
                          type: string
                        task_id:
                          type: integer
              example:
                status: ok
                to_wxid: 34757816141@chatroom
                target_type: group
                sent: 2
                results:
                  - path: /tmp/a.png
                    status: ok
                    task_id: 1
                  - path: /tmp/b.jpg
                    status: ok
                    task_id: 2
        '400':
          description: 参数错误，或未使用 full 模式
  /send_private_msg:
    post:
      summary: 发送文字消息
      tags: [消息]
      x-apifox-folder: 消息
      description: 发给好友。发给群用 `/send_group_msg`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, message]
              properties:
                user_id:
                  type: string
                  description: 好友 wxid
                message:
                  type: string
                  description: 文字内容
            example:
              user_id: wxid_friend
              message: 你好
      responses:
        '200':
          description: 成功
          content:
            application/json:
              example:
                status: ok
                sent: true
                task_id: 7
  /send_group_msg:
    post:
      summary: 发送群文字消息
      tags: [消息]
      x-apifox-folder: 消息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, message]
              properties:
                group_id:
                  type: string
                  description: 群 id
                message:
                  type: string
                  description: 文字内容
            example:
              group_id: 34757816141@chatroom
              message: 大家好
      responses:
        '200':
          description: 成功
          content:
            application/json:
              example:
                status: ok
                sent: true
                task_id: 8
  /ws:
    get:
      summary: WebSocket
      tags: [WebSocket]
      x-apifox-folder: WebSocket
      description: |
        地址 `ws://127.0.0.1:58080/ws`，鉴权和 HTTP 一样。

        发送：

        ```json
        {"action":"send_image","echo":"1","params":{"robot_wxid":"wxid_self","to_wxid":"34757816141@chatroom","path":["/tmp/a.png"]}}
        ```

        回复：

        ```json
        {"echo":"1","data":{"status":"ok","target_type":"group","sent":1}}
        ```

        文字用 `action` = `send_private_msg` 或 `send_group_msg`，`params` 与对应 HTTP 相同。
        微信事件会另外推一条 JSON，没有 `echo`。
      parameters:
        - name: access_token
          in: query
          required: false
          schema:
            type: string
      responses:
        '101':
          description: 切换到 WebSocket
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
